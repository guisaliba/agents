name: Pi setup checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./test.sh
  debian-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: ./pi/test-linux-install.sh > /tmp/pi-debian-verification.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debian-install-verification
          path: /tmp/pi-debian-verification.log
