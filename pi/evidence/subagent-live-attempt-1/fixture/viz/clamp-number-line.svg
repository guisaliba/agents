<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <rect width="900" height="300" fill="#f8fafc"/>
  <text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172b4d">Clamp on a number line</text>
  <text x="450" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#425466">The allowed interval is highlighted from low = 2 to high = 8</text>

  <rect x="234" y="145" width="432" height="50" rx="8" fill="#b9e7df"/>
  <line x1="90" y1="170" x2="810" y2="170" stroke="#263746" stroke-width="4" stroke-linecap="round"/>

  <g font-family="Arial, sans-serif" font-size="15" fill="#263746" text-anchor="middle">
    <g><line x1="90" y1="158" x2="90" y2="182" stroke="#263746" stroke-width="2"/><text x="90" y="214">0</text></g>
    <g><line x1="162" y1="158" x2="162" y2="182" stroke="#263746" stroke-width="2"/><text x="162" y="214">1</text></g>
    <g><line x1="234" y1="154" x2="234" y2="186" stroke="#087e72" stroke-width="3"/><text x="234" y="214" font-weight="700" fill="#087e72">2</text></g>
    <g><line x1="306" y1="158" x2="306" y2="182" stroke="#263746" stroke-width="2"/><text x="306" y="214">3</text></g>
    <g><line x1="378" y1="158" x2="378" y2="182" stroke="#263746" stroke-width="2"/><text x="378" y="214">4</text></g>
    <g><line x1="450" y1="158" x2="450" y2="182" stroke="#263746" stroke-width="2"/><text x="450" y="214">5</text></g>
    <g><line x1="522" y1="158" x2="522" y2="182" stroke="#263746" stroke-width="2"/><text x="522" y="214">6</text></g>
    <g><line x1="594" y1="158" x2="594" y2="182" stroke="#263746" stroke-width="2"/><text x="594" y="214">7</text></g>
    <g><line x1="666" y1="154" x2="666" y2="186" stroke="#087e72" stroke-width="3"/><text x="666" y="214" font-weight="700" fill="#087e72">8</text></g>
    <g><line x1="738" y1="158" x2="738" y2="182" stroke="#263746" stroke-width="2"/><text x="738" y="214">9</text></g>
    <g><line x1="810" y1="158" x2="810" y2="182" stroke="#263746" stroke-width="2"/><text x="810" y="214">10</text></g>
  </g>

  <line x1="738" y1="130" x2="678" y2="130" stroke="#d46b08" stroke-width="2.5"/>
  <path d="M678 130 l9 -6 v12 z" fill="#d46b08"/>
  <circle cx="738" cy="170" r="9" fill="#d46b08" stroke="#ffffff" stroke-width="3"/>
  <circle cx="666" cy="170" r="8" fill="#087e72" stroke="#ffffff" stroke-width="3"/>
  <text x="738" y="111" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#a34f00">input: 9</text>
  <text x="666" y="99" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#087e72">result: 8</text>

  <text x="450" y="263" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#172b4d">clamp(9, 2, 8) = 8</text>
</svg>
